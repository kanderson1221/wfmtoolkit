    <style>
      .sans { font-family: "IBM Plex Sans", Inter, Arial, sans-serif; }
      .title-lg { font: 700 34px "IBM Plex Sans", Inter, Arial, sans-serif; fill: #10253E; letter-spacing: -0.6px; }
      .title-md { font: 700 22px "IBM Plex Sans", Inter, Arial, sans-serif; fill: #10253E; }
