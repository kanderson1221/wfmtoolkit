      .metric { font: 700 26px "IBM Plex Sans", Inter, Arial, sans-serif; fill: #10253E; letter-spacing: -0.5px; }
      .label { font: 700 12px "IBM Plex Sans", Inter, Arial, sans-serif; fill: #6B7D90; letter-spacing: 1.6px; text-transform: uppercase; }
      .body { font: 500 15px "IBM Plex Sans", Inter, Arial, sans-serif; fill: #4D6073; }
      .body-sm { font: 500 13px "IBM Plex Sans", Inter, Arial, sans-serif; fill: #64788D; }
      .body-xs { font: 500 12px "IBM Plex Sans", Inter, Arial, sans-serif; fill: #7C8FA2; }
      .button { font: 700 14px "IBM Plex Sans", Inter, Arial, sans-serif; }
      .tab { font: 700 14px "IBM Plex Sans", Inter, Arial, sans-serif; }
      .mono { font: 600 13px "IBM Plex Sans", Inter, Arial, sans-serif; fill: #10253E; }
