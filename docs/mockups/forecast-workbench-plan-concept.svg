<svg width="1600" height="1120" viewBox="0 0 1600 1120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1600" y2="1120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5F8FC"/>
      <stop offset="1" stop-color="#EDF3F8"/>
    </linearGradient>
    <linearGradient id="heroGlow" x1="250" y1="88" x2="1110" y2="910" gradientUnits="userSpaceOnUse">
